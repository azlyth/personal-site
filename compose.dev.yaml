services:
  zola:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Runs as the host user, like scripts/build-site.sh does. Without this the
    # dev server writes public/ as root, and any file only this build produced
    # (a newly added static asset) then fails the production promote: rsync
    # runs as the host user and cannot chgrp a root-owned destination.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "1111:1111"
    volumes:
      - .:/project
    working_dir: /project
    command: serve --interface 0.0.0.0 --port 1111
    environment:
      - ZOLA_ENV=development
      
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      
  lab-backend:
    build:
      context: lab-backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./lab-backend:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data: 