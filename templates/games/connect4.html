<section class="game-panel" data-game="connect4" hidden>
    <div class="c4-wrap">
        <div class="c4-board" id="c4-board"></div>
    </div>
</section>

<style>
.c4-wrap {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
}

.c4-board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: clamp(4px, 1.3vw, 10px);
    background: #2f6fb3;
    border-radius: 14px;
    padding: clamp(6px, 2vw, 14px);
    box-shadow: 0 8px 24px rgba(20, 40, 60, 0.18);
    touch-action: manipulation;
    user-select: none;
}

.c4-board.c4-over {
    filter: grayscale(0.55) brightness(0.92);
}

.c4-col {
    position: relative;
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: inherit;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    font: inherit;
    -webkit-tap-highlight-color: transparent;
}

.c4-board.c4-over .c4-col,
.c4-col.c4-col-full {
    cursor: not-allowed;
}

.c4-cap {
    position: absolute;
    top: -0.55rem;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 8px solid #666;
    opacity: 0;
    transition: opacity 0.12s ease;
}

.c4-col-full .c4-cap {
    opacity: 0.85;
}

.c4-hole {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: #f7f7f5;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.25);
    overflow: visible;
}

.c4-disc {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    transform: translateY(0);
    box-shadow: inset 0 -3px 6px rgba(0, 0, 0, 0.18), inset 0 2px 3px rgba(255, 255, 255, 0.25);
}

.c4-disc-red { background: #b2402f; }
.c4-disc-yellow { background: #d9a226; }

.c4-disc.c4-drop {
    animation: c4-drop-in 0.28s cubic-bezier(0.34, 1.1, 0.64, 1);
}

@keyframes c4-drop-in {
    0% { transform: translateY(-320%); }
    100% { transform: translateY(0); }
}

.c4-hole.c4-win .c4-disc {
    box-shadow: 0 0 0 3px #2b2b2b, inset 0 -3px 6px rgba(0, 0, 0, 0.18);
}

.c4-preview {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s ease;
}

.c4-col:not(.c4-col-full):hover .c4-hole:first-child .c4-preview,
.c4-col:not(.c4-col-full).c4-press .c4-hole:first-child .c4-preview {
    opacity: 0.45;
}

.c4-board:not(.c4-over) .c4-col:not(.c4-col-full).c4-press .c4-hole:first-child .c4-preview {
    opacity: 0.65;
}
</style>

<script>
LabGames.register('connect4', {
    labels: { red: 'Red', yellow: 'Yellow' },

    mount(root) {
        const board = root.querySelector('#c4-board');
        const COLS = 7;
        const ROWS = 6;

        // Build the static grid once: 7 column buttons, each with a
        // full-column top-cap marker plus 6 stacked holes (row 0 on top).
        const cols = [];
        for (let c = 0; c < COLS; c++) {
            const col = document.createElement('button');
            col.type = 'button';
            col.className = 'c4-col';
            col.dataset.col = String(c);

            const cap = document.createElement('div');
            cap.className = 'c4-cap';
            col.appendChild(cap);

            const holes = [];
            for (let r = 0; r < ROWS; r++) {
                const hole = document.createElement('div');
                hole.className = 'c4-hole';
                if (r === 0) {
                    const preview = document.createElement('div');
                    preview.className = 'c4-preview';
                    hole.appendChild(preview);
                }
                col.appendChild(hole);
                holes.push(hole);
            }

            col.addEventListener('click', () => {
                if (col.classList.contains('c4-col-full')) return;
                if (board.classList.contains('c4-over')) return;
                LabGames.move('connect4', { col: c });
            });
            col.addEventListener('pointerdown', () => col.classList.add('c4-press'));
            col.addEventListener('pointerup', () => col.classList.remove('c4-press'));
            col.addEventListener('pointerleave', () => col.classList.remove('c4-press'));
            col.addEventListener('pointercancel', () => col.classList.remove('c4-press'));

            board.appendChild(col);
            cols.push({ el: col, holes });
        }

        root._c4 = { board, cols };
    },

    render(state) {
        const panel = document.querySelector('.game-panel[data-game="connect4"]');
        const { board, cols } = panel._c4;
        const rows = state.board.length;
        const cols_n = state.board[0].length;

        board.classList.toggle('c4-over', Boolean(state.over));

        const winSet = new Set();
        if (state.winningCells) {
            for (const { row, col } of state.winningCells) winSet.add(`${row},${col}`);
        }

        for (let c = 0; c < cols_n; c++) {
            const { el, holes } = cols[c];
            let full = true;
            for (let r = 0; r < rows; r++) {
                const value = state.board[r][c];
                if (value === null) full = false;
                const hole = holes[r];

                // Clear anything but the preview element, then redraw a disc
                // if this cell is occupied.
                const preview = hole.querySelector('.c4-preview');
                hole.innerHTML = '';
                if (preview) hole.appendChild(preview);

                if (value) {
                    const disc = document.createElement('div');
                    disc.className = `c4-disc c4-disc-${value}`;
                    if (state.lastMove && state.lastMove.row === r && state.lastMove.col === c) {
                        disc.classList.add('c4-drop');
                    }
                    hole.appendChild(disc);
                }

                hole.classList.toggle('c4-win', winSet.has(`${r},${c}`));
            }
            el.classList.toggle('c4-col-full', full);
        }
    }
});
</script>
