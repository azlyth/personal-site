# Replaces nginx:alpine's stock conf.d/default.conf. Same behaviour, plus a
# real 404: without error_page, a missing path gets nginx's built-in plain
# page ("404 Not Found") instead of the site's own 404.html, which is the one
# page on cloudy.nyc that wasn't named "… - Peter @ WWW".
#
# This is a single-file bind mount, so editing it and reloading serves the
# stale inode -- changes need `docker compose up -d --force-recreate web`.
server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # No `internal;` on purpose: /404.html stays directly fetchable (200), the
    # way GitHub Pages serves it, while missing paths get it with a 404 status.
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
