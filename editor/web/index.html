<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editing — Peter's blog</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/editor.css">
</head>
<body>
  <header class="bar">
    <select id="post-picker"></select>
    <button id="new-post" class="publish" title="Start a new post">+ New</button>
    <span id="status" class="status"></span>
    <button id="proofread" class="bar-action" title="Check spelling and grammar">✨ Proofread</button>
    <span id="proof-progress" class="proof-progress" hidden>
      <span class="proof-track"><span class="proof-fill"></span></span>
      <span class="proof-text"></span>
      <button id="proof-cancel" class="bar-action">Cancel</button>
    </span>
    <button id="undo" class="bar-action" title="Step back through your edits">↶ Undo</button>
    <button id="discard" class="bar-action danger" title="Throw away every change since the last publish">Discard</button>
    <button id="publish" class="publish">Publish</button>
    <button id="sign-out" class="bar-action" title="Sign out">Sign out</button>
    <button id="add-photo" class="add-photo" type="button" aria-label="Add photo" title="Add photo" hidden>📷</button>
    <input id="add-photo-input" type="file" accept="image/*" multiple hidden>
  </header>
  <main class="container">
    <h1 id="post-title" class="title" data-field="title"></h1>
    <div id="post-meta" class="post-meta"></div>
    <div id="post-links" class="post-links" hidden></div>
    <div id="blocks"></div>
  </main>
  <div id="review-bar" class="review-bar" hidden></div>
  <script src="/static/editor.js"></script>
</body>
</html>
